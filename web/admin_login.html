<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Acceso al panel</title>
<style>
  :root{
    --marca:#B03A2E;
    --tinta:#171310;
    --tinta-media:#6A615B;
    --fondo:#FFFFFF;
    --fondo-alt:#F6F3F0;
    --borde:#EDE8E3;
    --rojo:#B03A2E;
    --rojo-suave:#FBEAE8;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    /* El desplazamiento se mantiene, el zoom de pellizco no. Safari en iPhone
       ignora user-scalable=no, asi que el meta viewport no basta por si solo. */
    touch-action:pan-x pan-y;
  }
  body{
    background:var(--fondo-alt);
    color:var(--tinta);
    font-family:system-ui,sans-serif;
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:24px;
    touch-action:pan-x pan-y;
    overscroll-behavior:none;
  }
  .tarjeta{
    width:100%;max-width:360px;
    background:var(--fondo);
    border:1px solid var(--borde);
    border-radius:16px;
    padding:32px 28px;
  }
  h1{font-size:20px;margin-bottom:4px}
  p.sub{color:var(--tinta-media);font-size:14px;margin-bottom:24px}
  label{display:block;font-size:13px;color:var(--tinta-media);margin-bottom:6px}
  input{
    width:100%;padding:12px 14px;
    border:1px solid var(--borde);border-radius:10px;
    font-size:16px;margin-bottom:16px;
  }
  input:focus{outline:2px solid var(--marca);outline-offset:1px}
  button{
    width:100%;padding:12px;
    background:var(--marca);color:#fff;border:none;border-radius:10px;
    font-size:15px;font-weight:600;cursor:pointer;
  }
  button:disabled{opacity:.6;cursor:default}
  .error{
    display:none;
    background:var(--rojo-suave);color:var(--rojo);
    border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:16px;
  }
  .error.visible{display:block}
</style>
</head>
<body>
  <div class="tarjeta">
    <h1>Panel de gestión</h1>
    <p class="sub">Introduce la contraseña del restaurante</p>
    <div class="error" id="error">Contraseña incorrecta</div>
    <form id="form">
      <label for="clave">Contraseña</label>
      <input type="password" id="clave" name="clave" autocomplete="current-password" required>
      <button type="submit" id="boton">Entrar</button>
    </form>
  </div>
  <script>
    /* touch-action (CSS) no cubre del todo Safari en iPhone: estos dos
       oyentes tapan el pellizco y el doble toque que se le escapan. */
    ['gesturestart', 'gesturechange', 'gestureend'].forEach((tipo) =>
      document.addEventListener(tipo, (e) => e.preventDefault(), { passive: false }));

    let ultimoToque = 0;
    document.addEventListener('touchend', (e) => {
      const ahora = Date.now();
      const esCampo = e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
      if (ahora - ultimoToque <= 300 && !esCampo) {
        e.preventDefault();
        if (typeof e.target.click === 'function') e.target.click();
      }
      ultimoToque = ahora;
    }, { passive: false });

    const form = document.getElementById('form');
    const error = document.getElementById('error');
    const boton = document.getElementById('boton');

    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      error.classList.remove('visible');
      boton.disabled = true;
      boton.textContent = 'Entrando…';

      try {
        const clave = document.getElementById('clave').value;
        const resp = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ clave }),
        });
        if (resp.ok) {
          window.location.href = '/admin';
          return;
        }
        error.classList.add('visible');
      } catch (e) {
        error.textContent = 'No se pudo conectar. Inténtalo de nuevo.';
        error.classList.add('visible');
      } finally {
        boton.disabled = false;
        boton.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
